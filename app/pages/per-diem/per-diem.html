<ion-header>
  <ion-navbar>
    <ion-title>Per Diem</ion-title>
  </ion-navbar>
</ion-header>

<ion-content padding class="per-diem">
  <ion-list inset>

    <ion-item>
      <ion-icon style="z-index: 9001;" name="close" (click)="reset()" item-right></ion-icon>
      <ion-input type="text" [value]="city" placeholder="City name" (input)="update($event)"></ion-input>
    </ion-item>

    <ion-item *ngFor="let city of cities" (click)="selectCity(city)">
      <ion-icon [name]="city.saved ? 'star' : 'star-outline'" bright item-left (click)="toggleSaved($event, city)"></ion-icon>
      <h2>{{city.city}}, {{city.state}}</h2>
      <p>Meals: {{city.mie}}</p>
      <p>Lodging: {{city.lodgingRate}}</p>
    </ion-item>

  </ion-list>
</ion-content>

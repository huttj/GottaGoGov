<ion-header>
  <ion-navbar>
    <ion-title>Per Diem</ion-title>

    <ion-buttons end>
      <settings-popover></settings-popover>
    </ion-buttons>

  </ion-navbar>

  <ion-searchbar
    [(ngModel)]="city"
    [showCancelButton]="!!city"
    (ionInput)="update($event)"
    (ionCancel)="reset($event)">
  </ion-searchbar>

</ion-header>

<!--<ion-item>-->
  <!--<ion-icon style="z-index: 9001;" name="close" (click)="reset()" item-right></ion-icon>-->
  <!--<ion-input type="text" [value]="city" placeholder="City name" (input)="update($event)"></ion-input>-->
<!--</ion-item>-->

<ion-content padding class="per-diem">

  <ion-list inset>

    <ion-item *ngIf="!cities || !cities.length">
      <h2>No results match your search.</h2>
    </ion-item>

    <ion-item *ngFor="let city of cities" (click)="selectCity(city)">
      <ion-icon [name]="city.saved ? 'star' : 'star-outline'" bright item-left (click)="toggleSaved($event, city)"></ion-icon>
      <h2>{{city.city}}, {{city.abbr}}</h2>
      <p>Lodging: ${{city.lodging}}</p>
      <p>Meals: ${{city.mie}}</p>
    </ion-item>

  </ion-list>
</ion-content>

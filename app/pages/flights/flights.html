<ion-header class="bar-positive">
  <ion-navbar>
    <ion-title>
      Flights
    </ion-title>
  </ion-navbar>

  <ion-item>
    <ion-icon style="z-index: 9001;" name="close" (click)="resetOrigin()" item-right></ion-icon>
    <ion-input type="text" [value]="originSearch" placeholder="Origin / ICAO" (input)="updateOrigin($event)"></ion-input>
  </ion-item>

  <ion-item>
    <ion-icon style="z-index: 9001;" name="close" (click)="resetDestination()" item-right></ion-icon>
    <ion-input type="text" [value]="destinationSearch" placeholder="Destination / ICAO" (input)="updateDestination($event)"></ion-input>
  </ion-item>

</ion-header>

<ion-content>

  <ion-list inset>

    <ion-item *ngFor="let flight of results" (click)="selectFlight(flight)">
      <ion-icon bright [name]="flight.saved ? 'star' : 'star-outline'" item-left (click)="toggleSaved($event, flight)"></ion-icon>
      <h2>From: {{flight.originCityName}} ({{flight.originAirportLocation}})</h2>
      <h2>To: {{flight.destinationCityName}} ({{flight.destinationAirportLocation}})</h2>
      <p>YCA Fare: ${{flight.ycaFare}}</p>
      <p>XCA Fare: ${{flight.xcaFare}}</p>
    </ion-item>

  </ion-list>

</ion-content>

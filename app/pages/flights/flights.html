<ion-header>
  <ion-navbar>
    <ion-title>
      Flights
    </ion-title>
  </ion-navbar>
</ion-header>

<ion-content>


  <ion-list inset>

    <ion-item>
      <ion-icon style="z-index: 9001;" name="close" (click)="resetOrigin()" item-right></ion-icon>
      <ion-input type="text" [value]="originSearch" placeholder="Origin" (input)="updateOrigin($event)"></ion-input>
    </ion-item>

    <ion-item>
      <ion-icon style="z-index: 9001;" name="close" (click)="resetDestination()" item-right></ion-icon>
      <ion-input type="text" [value]="destinationSearch" placeholder="Destination" (input)="updateDestination($event)"></ion-input>
    </ion-item>

    <ion-item *ngFor="let flight of results">
      <ion-icon bright [name]="flight.saved ? 'star' : 'star-outline'" item-left (click)="toggleSaved(flight)"></ion-icon>
      <h2>{{flight.originCity}} ({{flight.originAirport}}) to {{flight.destinationCity}} ({{flight.originAirport}})</h2>
      <p>YCA Fare: {{flight.ycaFare}}</p>
      <p>XCA Fare: {{flight.xcaFare}}</p>
    </ion-item>

  </ion-list>

</ion-content>
